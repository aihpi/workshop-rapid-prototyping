# HPI Studio. One command brings up the database, applies migrations, starts the
# API and serves the built frontend through nginx.
#
#   docker compose up --build        everything, then open http://localhost:8080
#   docker compose up db             just Postgres, for `npm run dev:api` and
#                                    `npm run dev:web` on the host

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: 02_backend/Dockerfile
    command: ["npm", "run", "migrate", "-w", "02_backend"]
    environment:
      DATABASE_URL: postgres://studio:studio@db:5432/studio
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: 02_backend/Dockerfile
    environment:
      DATABASE_URL: postgres://studio:studio@db:5432/studio
      SAMPLES_DIR: /data/samples
      PORT: "3000"
    volumes:
      - samples:/data/samples
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: 01_frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - samples:/data/samples:ro
    depends_on:
      - api

volumes:
  pgdata:
  samples:
